name: Publish to npm

# Publishes @kbncodes/mcp-server-hub to npm using OIDC trusted publishing.
# No tokens/secrets required: npm verifies this workflow's identity via OIDC.
# Trigger by creating a GitHub Release (bump the version in package.json first),
# or run manually via "Run workflow".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure OIDC-capable npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (OIDC trusted publishing + provenance)
        run: npm publish --access public
