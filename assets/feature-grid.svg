<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MCP Server Hub key features grid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="600" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff">Why MCP Server Hub?</text>
  <text x="600" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#c4b5fd">Production-ready gateway for AI agents — secure, stateless, one-click</text>

  <!-- cards: 3 columns x 2 rows -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- row 1 -->
    <g transform="translate(60,140)">
      <rect width="340" height="200" rx="22" fill="url(#card)" stroke="#4f46e5" stroke-width="2"/>
      <text x="30" y="70" font-size="46">🔌</text>
      <text x="30" y="118" font-size="24" font-weight="700" fill="#ffffff">5 servers, 1 endpoint</text>
      <text x="30" y="152" font-size="16" fill="#cbd5e1">Fetch · Memory · GitHub ·</text>
      <text x="30" y="176" font-size="16" fill="#cbd5e1">Postgres · Utils — no juggling.</text>
    </g>
    <g transform="translate(430,140)">
      <rect width="340" height="200" rx="22" fill="url(#card)" stroke="#7c3aed" stroke-width="2"/>
      <text x="30" y="70" font-size="46">🌊</text>
      <text x="30" y="118" font-size="24" font-weight="700" fill="#ffffff">Stateless HTTP</text>
      <text x="30" y="152" font-size="16" fill="#cbd5e1">2026-07-28 MCP spec. Any</text>
      <text x="30" y="176" font-size="16" fill="#cbd5e1">replica serves any request.</text>
    </g>
    <g transform="translate(800,140)">
      <rect width="340" height="200" rx="22" fill="url(#card)" stroke="#a855f7" stroke-width="2"/>
      <text x="30" y="70" font-size="46">🔑</text>
      <text x="30" y="118" font-size="24" font-weight="700" fill="#ffffff">Single-token auth</text>
      <text x="30" y="152" font-size="16" fill="#cbd5e1">One Bearer token. Fail-closed,</text>
      <text x="30" y="176" font-size="16" fill="#cbd5e1">timing-safe, lockout on abuse.</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(60,360)">
      <rect width="340" height="200" rx="22" fill="url(#card)" stroke="#a855f7" stroke-width="2"/>
      <text x="30" y="70" font-size="46">🚀</text>
      <text x="30" y="118" font-size="24" font-weight="700" fill="#ffffff">Deploy in seconds</text>
      <text x="30" y="152" font-size="16" fill="#cbd5e1">One-click Railway / Render,</text>
      <text x="30" y="176" font-size="16" fill="#cbd5e1">or npx to run locally.</text>
    </g>
    <g transform="translate(430,360)">
      <rect width="340" height="200" rx="22" fill="url(#card)" stroke="#7c3aed" stroke-width="2"/>
      <text x="30" y="70" font-size="46">🛡️</text>
      <text x="30" y="118" font-size="24" font-weight="700" fill="#ffffff">Secure by default</text>
      <text x="30" y="152" font-size="16" fill="#cbd5e1">SSRF guards · READ-ONLY SQL ·</text>
      <text x="30" y="176" font-size="16" fill="#cbd5e1">helmet · CSP · non-root Docker.</text>
    </g>
    <g transform="translate(800,360)">
      <rect width="340" height="200" rx="22" fill="url(#card)" stroke="#4f46e5" stroke-width="2"/>
      <text x="30" y="70" font-size="46">🧩</text>
      <text x="30" y="118" font-size="24" font-weight="700" fill="#ffffff">Extensible</text>
      <text x="30" y="152" font-size="16" fill="#cbd5e1">Add a server in one file —</text>
      <text x="30" y="176" font-size="16" fill="#cbd5e1">it shows up in the dashboard.</text>
    </g>
  </g>

  <text x="600" y="608" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#a5b4fc">github.com/KbnCodes/mcp-server-hub  ·  MIT licensed  ·  ⭐ npm: @kbncodes/mcp-server-hub</text>
</svg>
