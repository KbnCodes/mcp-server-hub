<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MCP Server Hub architecture: one AI agent connects through one authenticated gateway to five MCP servers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- title -->
  <text x="600" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">MCP Server Hub</text>
  <text x="600" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#c4b5fd">One URL · one token · five MCP servers · stateless by design</text>

  <!-- AI agent box -->
  <g>
    <rect x="70" y="270" width="200" height="110" rx="20" fill="#111827" stroke="#4f46e5" stroke-width="3"/>
    <text x="170" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">AI Agent</text>
    <text x="170" y="348" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#94a3b8">Claude · Cursor</text>
    <text x="170" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#94a3b8">LibreChat · custom</text>
  </g>

  <!-- connector agent -> gateway -->
  <line x1="270" y1="325" x2="470" y2="325" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <polygon points="470,325 452,316 452,334" fill="#a855f7"/>
  <rect x="285" y="288" width="170" height="30" rx="15" fill="#312e81"/>
  <text x="370" y="309" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#c7d2fe">1 URL + 1 token 🔑</text>

  <!-- gateway hexagon -->
  <g transform="translate(560,250)">
    <polygon points="75,0 145,40 145,120 75,160 5,120 5,40" fill="url(#hex)" stroke="#a855f7" stroke-width="5"/>
    <!-- padlock -->
    <g transform="translate(75,68)">
      <path d="M-17 4 v-10 a17 17 0 0 1 34 0 v10" fill="none" stroke="#6d28d9" stroke-width="9" stroke-linecap="round"/>
      <rect x="-26" y="4" width="52" height="44" rx="9" fill="#6d28d9"/>
      <circle cx="0" cy="22" r="6" fill="#e0e7ff"/>
      <rect x="-4" y="22" width="8" height="15" rx="4" fill="#e0e7ff"/>
    </g>
    <text x="75" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Gateway</text>
    <text x="75" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">Stateless Streamable HTTP</text>
  </g>

  <!-- connectors gateway -> servers -->
  <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.75" fill="none">
    <path d="M710 300 C 800 200, 860 160, 940 150"/>
    <path d="M712 315 C 810 270, 860 250, 940 245"/>
    <path d="M712 330 C 810 330, 860 335, 940 340"/>
    <path d="M712 345 C 810 390, 860 420, 940 435"/>
    <path d="M710 360 C 800 460, 860 500, 940 530"/>
  </g>

  <!-- server nodes -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(940,120)">
      <rect width="200" height="58" rx="14" fill="#0b1220" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="34" cy="29" r="14" fill="url(#node)" filter="url(#soft)"/>
      <text x="60" y="27" font-size="19" font-weight="700" fill="#ffffff">🌐 Fetch</text>
      <text x="60" y="46" font-size="13" fill="#7dd3fc">SSRF-guarded web</text>
    </g>
    <g transform="translate(940,215)">
      <rect width="200" height="58" rx="14" fill="#0b1220" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="34" cy="29" r="14" fill="url(#node)" filter="url(#soft)"/>
      <text x="60" y="27" font-size="19" font-weight="700" fill="#ffffff">🧠 Memory</text>
      <text x="60" y="46" font-size="13" fill="#7dd3fc">shared notes store</text>
    </g>
    <g transform="translate(940,310)">
      <rect width="200" height="58" rx="14" fill="#0b1220" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="34" cy="29" r="14" fill="url(#node)" filter="url(#soft)"/>
      <text x="60" y="27" font-size="19" font-weight="700" fill="#ffffff">🐙 GitHub</text>
      <text x="60" y="46" font-size="13" fill="#7dd3fc">read-only REST</text>
    </g>
    <g transform="translate(940,405)">
      <rect width="200" height="58" rx="14" fill="#0b1220" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="34" cy="29" r="14" fill="url(#node)" filter="url(#soft)"/>
      <text x="60" y="27" font-size="19" font-weight="700" fill="#ffffff">🐘 Postgres</text>
      <text x="60" y="46" font-size="13" fill="#7dd3fc">READ ONLY SQL</text>
    </g>
    <g transform="translate(940,500)">
      <rect width="200" height="58" rx="14" fill="#0b1220" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="34" cy="29" r="14" fill="url(#node)" filter="url(#soft)"/>
      <text x="60" y="27" font-size="19" font-weight="700" fill="#ffffff">🛠️ Utils</text>
      <text x="60" y="46" font-size="13" fill="#7dd3fc">time·uuid·hash</text>
    </g>
  </g>

  <!-- footer -->
  <text x="600" y="600" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#a5b4fc">npx @kbncodes/mcp-server-hub  ·  Deploy on Railway in one click</text>
</svg>
