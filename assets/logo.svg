<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="MCP Server Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)"/>

  <!-- connections from hub to nodes -->
  <g stroke="#c4b5fd" stroke-width="7" stroke-linecap="round" opacity="0.7">
    <line x1="256" y1="256" x2="256" y2="106"/>
    <line x1="256" y1="256" x2="399" y2="210"/>
    <line x1="256" y1="256" x2="344" y2="377"/>
    <line x1="256" y1="256" x2="168" y2="377"/>
    <line x1="256" y1="256" x2="113" y2="210"/>
  </g>

  <!-- outer server nodes -->
  <g fill="url(#node)" filter="url(#glow)">
    <circle cx="256" cy="106" r="30"/>
    <circle cx="399" cy="210" r="30"/>
    <circle cx="344" cy="377" r="30"/>
    <circle cx="168" cy="377" r="30"/>
    <circle cx="113" cy="210" r="30"/>
  </g>

  <!-- central gateway hexagon -->
  <polygon points="256,186 316,221 316,291 256,326 196,291 196,221"
           fill="url(#hex)" stroke="#c7d2fe" stroke-width="4"/>

  <!-- padlock: secure auth -->
  <g fill="none" stroke="#6d28d9" stroke-width="11" stroke-linecap="round">
    <path d="M239 246 v-10 a17 17 0 0 1 34 0 v10"/>
  </g>
  <rect x="230" y="246" width="52" height="46" rx="9" fill="#6d28d9"/>
  <circle cx="256" cy="266" r="7" fill="#e0e7ff"/>
  <rect x="252" y="266" width="8" height="16" rx="4" fill="#e0e7ff"/>
</svg>
